# Nginx = the reverse proxy in front of the MCP server. The public (or your browser) talks to Nginx; Nginx forwards
# /mcp to the Node container. It handles what the app should not: abuse limits, header hygiene, request size.
# This file is mounted as /etc/nginx/conf.d/default.conf, which Nginx includes inside its `http { }` block, so the
# http-level directive below is valid here.

# One shared counter per client IP: 10 requests/second sustained, short bursts allowed (see `burst` below).
limit_req_zone $binary_remote_addr zone=mcp_per_ip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;                 # do not advertise the Nginx version

    client_max_body_size 64k;          # a tools/call is tiny; reject anything bigger with 413 BEFORE it reaches Node
    client_body_timeout   10s;         # slow-loris protection: a client must send its body promptly
    client_header_timeout 10s;

    # Security headers. `always` = also on error responses. This server only returns JSON, so the page-level policy is
    # "nothing may load or frame anything". (The views have their own CSP, delivered through the MCP resource metadata.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    # HSTS only means something over HTTPS (TLS is added in front of this container, see docs/DEPLOY.md). Browsers ignore
    # it on plain http, so it is safe to send from here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /mcp {
        limit_req zone=mcp_per_ip burst=20 nodelay;

        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                         # allow keep-alive to the upstream
        proxy_set_header Host $host;                            # the app validates it (ALLOWED_HOSTS)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the app reads the client IP from here (TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        # MCP responses are Server-Sent Events. Buffering would hold the whole response back until it ends, which
        # defeats streaming (progress, partial results) and delays every answer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://app:3000/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
    }

    # Everything else is closed: there is no other public surface.
    location / {
        return 404;
    }
}
